services:
  bar:
    container_name: elmariam-bar-svc
    image: ranckosolutionsinc/elmariam-bar-service:1.0.0
    # build: ./
    restart: always
    environment:
      - PORT=8004
    env_file:
      - ./.env
    # ports:
    #   - "8004:8004"
    networks:
      - elmariam-network
    depends_on:
      - minio

  minio:
    container_name: elmariam-object-store
    # image: minio/minio:2025-04-22
    image: ranckosolutionsinc/s3:lts
    restart: always
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio_password
      - MINIO_SERVER_URL=https://s3.otienoobogeandcompany.com  # Important for console to work
      - MINIO_BROWSER_REDIRECT_URL=https://minio.otienoobogeandcompany.com  # Console redirect
    ports:
      - 9003:9000
      - 9001:9001
    volumes:
      - ./uploads:/data
    networks:
      - elmariam-network
    command: server /data --console-address ":9001"
    labels:
      - "traefik.enable=true"
      
      # S3 API Router (port 9000)
      - "traefik.http.routers.s3.rule=Host(`s3.otienoobogeandcompany.com`)"
      # - "traefik.http.routers.s3.entrypoints=websecure"
      # - "traefik.http.routers.s3.tls=true"
      # - "traefik.http.routers.s3.tls.certresolver=letsencrypt"  # adjust to your certresolver
      - "traefik.http.routers.s3.service=s3"
      - "traefik.http.services.s3.loadbalancer.server.port=9000"
      
      # MinIO Console Router (port 9001)
      - "traefik.http.routers.minio.rule=Host(`minio.otienoobogeandcompany.com`)"
      # - "traefik.http.routers.minio.entrypoints=websecure"
      # - "traefik.http.routers.minio.tls=true"
      # - "traefik.http.routers.minio.tls.certresolver=letsencrypt"  # adjust to your certresolver
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

networks:
  elmariam-network:
    name: elmariam
    driver: bridge
    external: true
