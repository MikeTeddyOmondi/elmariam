name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: rancksolutionsinc/elmariam-admin-app
            dockerfile: apps/admin/Dockerfile
          - image: rancksolutionsinc/elmariam-staff-app
            dockerfile: apps/staff/Dockerfile
          - image: rancksolutionsinc/elmariam-website
            dockerfile: apps/website/Dockerfile
          - image: rancksolutionsinc/elmariam-integrations
            dockerfile: services/integrations/Dockerfile
          - image: rancksolutionsinc/elmariam-openauth
            dockerfile: infra/openauth/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
