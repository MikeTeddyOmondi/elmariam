name: CI

on:
  push:
    branches:
      - main
      - feat/simplifying-stack
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm --filter @elmariam/db build --filter @elmariam/queue build

      - name: Typecheck
        run: pnpm turbo typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm --filter @elmariam/db build --filter @elmariam/queue build

      - name: Build apps
        run: pnpm turbo build --filter=@elmariam/admin --filter=@elmariam/staff --filter=@elmariam/website
