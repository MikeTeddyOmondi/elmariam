x-common-env: &common-env
  MONGODB_URL: mongodb://mongo:27017/elmariam

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-user}
  RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-password}
  RABBITMQ_VHOST: ${RABBITMQ_DEFAULT_VHOST:-elmariam}

services:
  # ──── Infrastructure ────
  mongo:
    container_name: elmariam-mongo
    image: mongo:4.2
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - elmariam-mongodb-data:/data/db
    networks:
      - elmariam-network

  compass:
    container_name: elmariam-mongodb-compass
    image: haohanyang/compass-web:0.4.1
    ports:
      - 8765:8080
    environment:
      - CW_MONGO_URI=mongodb://mongo:27017
      - CW_ENABLE_SHELL=true
      - CW_ENABLE_EDIT_CONNECTIONS=true
      - CW_BASIC_AUTH_USERNAME=admin
      - CW_BASIC_AUTH_PASSWORD=password
    networks:
      - elmariam-network

  rabbitmq:
    container_name: elmariam-queue
    image: rabbitmq:3.12-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-user}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-password}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST:-elmariam}
    networks:
      - elmariam-network

  minio:
    container_name: elmariam-object-store
    image: ranckosolutionsinc/s3:lts
    restart: always
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio_password
      - MINIO_SERVER_URL=https://s3.otienoobogeandcompany.com
      - MINIO_BROWSER_REDIRECT_URL=https://minio.otienoobogeandcompany.com
    ports:
      - "9003:9000"
      - "9001:9001"
    volumes:
      - elmariam-minio-data:/data
    command: server /data --console-address ":9001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.s3.rule=Host(`s3.otienoobogeandcompany.com`)"
      - "traefik.http.routers.s3.service=s3"
      - "traefik.http.services.s3.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio.rule=Host(`minio.otienoobogeandcompany.com`)"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
    networks:
      - elmariam-network

  # ──── Reverse Proxy ────
  reverse-proxy:
    image: traefik:v2.11
    container_name: elmariam-proxy
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
    restart: always
    ports:
      - "7979:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - elmariam-network

  # ──── Auth ────
  openauth:
    container_name: elmariam-openauth
    image: rancksolutionsinc/elmariam-openauth
    build:
      context: .
      dockerfile: infra/openauth/Dockerfile
    restart: always
    environment:
      - PORT=3100
      - DATABASE_URL=mongodb://mongo:27017/auth
      - OPENAUTH_ISSUER=https://auth.otienoobogeandcompany.com
    ports:
      - "3100:3100"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.otienoobogeandcompany.com`)"
      - "traefik.http.services.auth.loadbalancer.server.port=3100"
    depends_on:
      - mongo
    networks:
      - elmariam-network

  # ──── Integrations Service (M-Pesa + SMS + Email) ────
  integrations:
    container_name: elmariam-integrations-svc
    image: rancksolutionsinc/elmariam-integrations
    build:
      context: .
      dockerfile: services/integrations/Dockerfile
    restart: always
    environment:
      <<: *rabbitmq-env
      PORT: 8010
      INTASEND_API_TOKEN: ${INTASEND_API_TOKEN}
      INTASEND_PUBLISHABLE_KEY: ${INTASEND_PUBLISHABLE_KEY}
      INTASEND_TEST_MODE: ${INTASEND_TEST_MODE:-true}
      UJUMBESMS_API_KEY: ${UJUMBESMS_API_KEY}
      UJUMBESMS_API_URL: ${UJUMBESMS_API_URL:-https://ujumbesms.co.ke}
      UJUMBESMS_ACCOUNT_EMAIL: ${UJUMBESMS_ACCOUNT_EMAIL}
      EMAIL_SENDER: ${EMAIL_SENDER}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - rabbitmq
    networks:
      - elmariam-network

  # ──── Frontend Apps ────
  admin:
    container_name: elmariam-admin-app
    image: rancksolutionsinc/elmariam-admin-app
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: always
    environment:
      <<: *common-env
      OPENAUTH_ISSUER: http://openauth:3100
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin-panel.otienoobogeandcompany.com`)"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"
    depends_on:
      - mongo
      - openauth
    networks:
      - elmariam-network

  staff:
    container_name: elmariam-staff-app
    image: rancksolutionsinc/elmariam-staff-app
    build:
      context: .
      dockerfile: apps/staff/Dockerfile
    restart: always
    environment:
      <<: *common-env
      OPENAUTH_ISSUER: http://openauth:3100
    ports:
      - "3001:3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.staff.rule=Host(`staff-panel.otienoobogeandcompany.com`)"
      - "traefik.http.services.staff.loadbalancer.server.port=3001"
    depends_on:
      - mongo
      - openauth
    networks:
      - elmariam-network

  website:
    container_name: elmariam-website
    image: rancksolutionsinc/elmariam-website
    build:
      context: .
      dockerfile: apps/website/Dockerfile
    restart: always
    environment:
      <<: *common-env
      OPENAUTH_ISSUER: http://openauth:3100
    ports:
      - "3002:3002"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`elmariam.otienoobogeandcompany.com`)"
      - "traefik.http.services.website.loadbalancer.server.port=3002"
    depends_on:
      - mongo
      - openauth
    networks:
      - elmariam-network

volumes:
  elmariam-mongodb-data:
  elmariam-minio-data:

networks:
  elmariam-network:
    name: elmariam
    driver: bridge
